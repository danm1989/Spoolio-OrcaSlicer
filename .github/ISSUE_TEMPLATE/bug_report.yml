name: Bug report
description: Somethings' not right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What was the expected behavior?
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Spoolio version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: orca
    attributes:
      label: OrcaSlicer version
      placeholder: "nightly 2026-09-28"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows x86_64
        - Linux x86_64
        - Linux arm64
        - macOS arm64 (Apple silicon)
        - macOS x86_64 (Intel)
    validations:
      required: true
  - type: input
    id: spoolman
    attributes:
      label: Spoolman version
      placeholder: "shown on the plugin's Settings & About page"
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Paste the end of spoolio.log (its path is shown at the bottom of the plugin's Settings & About page). Also useful - the plugin's Diagnostics tab in OrcaSlicer.
      render: text
